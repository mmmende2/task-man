name: Publish

# Build the deployable image and push it to GHCR, so the droplet only ever
# pulls (no on-box builds — a cold build thrashes the 1GB box). Fires on:
#   - merge to main        -> tags :latest + :sha-<short> + :<git-describe>
#   - push of a vX.Y.Z tag -> tags :vX.Y.Z + :sha-<short> + :<git-describe>
#     (this is what `git push origin vX.Y.Z` at release time triggers, giving a
#      clean :vX.Y.Z image to deploy deliberately; does NOT move :latest)
#   - workflow_dispatch    -> manual re-publish of whatever's checked out
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Read the repo; write packages (push to GHCR via the built-in GITHUB_TOKEN —
# no repo secrets needed).
permissions:
  contents: read
  packages: write

# Never cancel a publish mid-push; let each merge publish in order.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags so git describe resolves the release anchor

      # Assemble the image tag list. Always: sha-<short> (immutable rollback
      # target) + the git-describe stamp (matches /healthz). Plus one moving
      # ref depending on the trigger — :latest for a main merge, or the clean
      # :vX.Y.Z for a release-tag push (so releases deploy by their bare tag).
      - name: image tags + describe
        id: meta
        run: |
          IMAGE=ghcr.io/mmmende2/task-man
          LANDING_IMAGE=ghcr.io/mmmende2/task-man-landing
          # --tags is REQUIRED, not cosmetic. actions/checkout resolves a tag
          # push by force-fetching the triggering SHA straight into
          # refs/tags/<tag> ("git fetch --no-tags origin +<sha>:refs/tags/v0.6.0"),
          # which REPLACES the annotated tag object with a lightweight one.
          # Bare `git describe` only considers annotated tags, so it then walked
          # back to the PREVIOUS release: the v0.6.0 tag build stamped itself
          # "v0.5.1-5-g939826d" and published that as :v0.6.0. --tags counts
          # lightweight tags too, so the clobbered tag is still found.
          # --match keeps stray non-release tags out of the anchor.
          DESCRIBE=$(git describe --tags --long --always --match 'v[0-9]*')
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAGS="${IMAGE}:sha-${SHORT_SHA},${IMAGE}:${DESCRIBE}"
          LANDING_TAGS="${LANDING_IMAGE}:sha-${SHORT_SHA},${LANDING_IMAGE}:${DESCRIBE}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="${TAGS},${IMAGE}:${{ github.ref_name }}"
            LANDING_TAGS="${LANDING_TAGS},${LANDING_IMAGE}:${{ github.ref_name }}"
          else
            TAGS="${TAGS},${IMAGE}:latest"
            LANDING_TAGS="${LANDING_TAGS},${LANDING_IMAGE}:latest"
          fi
          echo "describe=${DESCRIBE}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "landing_tags=${LANDING_TAGS}" >> "$GITHUB_OUTPUT"
          echo "==> publishing: ${TAGS}"
          echo "==> publishing: ${LANDING_TAGS}"

      # Turn a mis-stamped release into a RED build instead of a wrong image.
      # On a vX.Y.Z tag push the describe anchor must be that exact tag with
      # zero commits past it, and package.json must carry the same version —
      # the release image's stamp, its :vX.Y.Z name and its /healthz `version`
      # all have to agree, or you cannot trust what's deployed.
      - name: verify the release stamp
        if: github.ref_type == 'tag'
        run: |
          TAG="${{ github.ref_name }}"
          DESCRIBE="${{ steps.meta.outputs.describe }}"
          PKG="v$(node -p "require('./cli/package.json').version")"
          fail=0
          case "$DESCRIBE" in
            "${TAG}-0-g"*) ;;
            *) echo "::error::describe '${DESCRIBE}' is not anchored to ${TAG}-0-g<sha>"; fail=1 ;;
          esac
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::cli/package.json is ${PKG} but the tag is ${TAG}"; fail=1
          fi
          [ "$fail" -eq 0 ] && echo "==> stamp verified: ${DESCRIBE} (package.json ${PKG})"
          exit "$fail"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64 # matches the droplet
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: GIT_DESCRIBE=${{ steps.meta.outputs.describe }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Never serve the `runtime` stage from cache: it bakes GIT_DESCRIBE
          # into TASK_MAN_BUILD, and a release (tag) build runs right after the
          # merge-to-main build of the SAME commit. Those two runs can legitimately
          # compute different stamps (the merge build may check out before the
          # release tag is pushed), so a shared cache layer keyed on the same
          # commit would let one inherit the other's stamp. Forcing this small
          # stage to rebuild pins the stamp to the actual build; the heavy
          # `build` stage stays cached.
          #
          # NOTE: this alone did NOT fix the "v0.6.0 deploy reads as v0.5.1-5-g…"
          # bug it was originally added for — that was a bare `git describe`
          # ignoring the lightweight tag actions/checkout leaves behind, fixed in
          # the `meta` step above. Kept because the cache hazard is real and
          # separate.
          no-cache-filters: runtime

      # Second image, same commit, same tag scheme: the public landing +
      # signup service (docs/landing-signup-plan.md). Separate Dockerfile,
      # separate GHCR repo — deployed as its own compose service, released
      # in lockstep with the main image via the same TASK_MAN_TAG.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: landing/Dockerfile
          platforms: linux/amd64 # matches the droplet
          push: true
          tags: ${{ steps.meta.outputs.landing_tags }}
          build-args: GIT_DESCRIBE=${{ steps.meta.outputs.describe }}
          cache-from: type=gha,scope=landing
          cache-to: type=gha,scope=landing,mode=max
          # Same stamp-inheritance hazard as the main image's runtime stage
          # (see the comment above) — force it to rebuild every run.
          no-cache-filters: runtime

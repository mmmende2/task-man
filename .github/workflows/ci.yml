name: CI

on:
  pull_request:
    branches: [main]

# Least privilege: CI only reads the repo (it never publishes — that's
# publish.yml's job).
permissions:
  contents: read

# One in-flight run per branch; a new push cancels the old run.
concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # cli + web unit tests and typechecks. One npm workspace: `npm ci` at the
  # root installs both packages into a single hoisted tree, and the root
  # `build`/`test` scripts run cli before web (web imports task-man/* which
  # resolve to cli/dist through the workspace symlink) — same ordering as
  # cli/Dockerfile.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: install, build (typecheck), test
        run: |
          npm ci
          npm run build
          npm test

  # Enforce that every PR declares its version intent: a changeset file (or an
  # explicit empty one, `changeset add --empty`, for changes that need no
  # release). Release PRs (branch `release/*`) consume changesets and add none,
  # so the gate is skipped for them — but the job still runs and reports success
  # so it stays a valid required status check (a skipped required check would
  # block the merge forever).
  changeset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: require a changeset (skipped on release/* PRs)
        run: |
          if [[ "${{ github.head_ref }}" == release/* ]]; then
            echo "release PR — changeset gate skipped"
            exit 0
          fi
          git fetch origin main
          npx changeset status --since=origin/main

  # Full image build — validates that the production bundle (cli + web)
  # actually compiles into the deployable image. This is the check that
  # catches a broken/stale web bundle before it can ship. Uses buildx with a
  # GitHub Actions layer cache so a source-only PR reuses the npm ci layers
  # (see cli/Dockerfile's layer ordering). Does not push — publish.yml does.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags so git describe resolves the release anchor
      - uses: docker/setup-buildx-action@v3
      # --tags/--match mirror publish.yml exactly — see the long note there on
      # why a bare `git describe` mis-anchors a tag build. Kept identical so CI
      # exercises the same stamp the publish will bake in.
      - name: describe build
        id: describe
        run: echo "value=$(git describe --tags --long --always --match 'v[0-9]*')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: cli/Dockerfile
          push: false
          tags: task-man:ci
          build-args: GIT_DESCRIBE=${{ steps.describe.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

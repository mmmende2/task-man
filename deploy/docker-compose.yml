services:
  task-man:
    # Pull-based deploy: CI (publish.yml) builds and pushes the image to GHCR
    # on every merge to main; the droplet only pulls (no on-box builds — a cold
    # build thrashes the 1GB box). TASK_MAN_TAG is REQUIRED and names the image
    # to deploy — deliberately no default, so a bare `up -d` can't silently ship
    # "whatever latest is". Set it every deploy (export it so pull/up/logs/ps all
    # see it): a vX.Y.Z release tag, or a sha-<short> / vX.Y.Z-N-g<sha> stamp.
    #   export TASK_MAN_TAG=v0.5.1
    # To build on-box instead (emergency/local), add the override file:
    #   -f deploy/docker-compose.yml -f deploy/docker-compose.build.yml
    image: ghcr.io/mmmende2/task-man:${TASK_MAN_TAG:?set TASK_MAN_TAG to the version to deploy, e.g. v0.5.1}
    restart: unless-stopped
    environment:
      # Origin-side verification of the Access JWT that Cloudflare attaches
      # to every request — defense in depth beyond the tunnel itself.
      - CF_ACCESS_TEAM_DOMAIN=${CF_ACCESS_TEAM_DOMAIN}
      - CF_ACCESS_AUD=${CF_ACCESS_AUD}
      # Authorization: legacy-task owner + service-token→person mapping.
      - TASK_MAN_DEFAULT_OWNER=${TASK_MAN_DEFAULT_OWNER}
      - TASK_MAN_AGENTS=${TASK_MAN_AGENTS}
      # The server computes "today" (metrics, reports) in ITS local time.
      # Without this the container is UTC and evening completions fall on
      # tomorrow's date, so server-rendered metrics drop them. Set to the
      # primary user's IANA timezone.
      - TZ=${TZ:-UTC}
    volumes:
      - task-man-data:/root/.task-man
    networks:
      - internal
    # Deliberately no `ports:` — cloudflared is the only thing that reaches
    # this container, over the internal docker network. No inbound ports on
    # the droplet itself.

  # Public landing page + approval-gated signup (docs/landing-signup-plan.md).
  # Unlike task-man, this hostname carries NO Cloudflare Access application —
  # that's what makes it public. Released in lockstep with task-man: same
  # TASK_MAN_TAG, same deploy.
  landing:
    image: ghcr.io/mmmende2/task-man-landing:${TASK_MAN_TAG:?set TASK_MAN_TAG to the version to deploy, e.g. v0.5.1}
    restart: unless-stopped
    environment:
      # Resend notification of new signups. Leave all three unset to run in
      # dev mode (signups are recorded but no email is sent) — see
      # landing/src/env.ts; this is all-or-nothing, not individually optional.
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SIGNUP_NOTIFY_TO=${SIGNUP_NOTIFY_TO}
      - PRODUCT_URL=${PRODUCT_URL}
      # CAPTCHA on the signup form. Both-or-neither; the container refuses to
      # start if unset (fail closed on the public droplet — see env.ts). No
      # SIGNUP_ALLOW_NO_CAPTCHA passthrough here on purpose: production must
      # not have a way to opt out of CAPTCHA.
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY}
      # One-click approve/deny links + the Cloudflare Access group mutation.
      # Also all-or-nothing; unset all five to fall back to v1 (notify only,
      # approve by hand in the Zero Trust dashboard). LANDING_PUBLIC_URL fixes
      # the origin baked into approve/deny links so it can't be steered by a
      # spoofed request Host header.
      - SIGNUP_HMAC_SECRET=${SIGNUP_HMAC_SECRET}
      - CF_API_TOKEN=${CF_API_TOKEN}
      - CF_ACCOUNT_ID=${CF_ACCOUNT_ID}
      - CF_ACCESS_GROUP_ID=${CF_ACCESS_GROUP_ID}
      - LANDING_PUBLIC_URL=${LANDING_PUBLIC_URL}
    volumes:
      - landing-data:/root/.task-man-landing
    networks:
      - internal
    # No `ports:` here either — same reasoning as task-man above.

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - internal
    depends_on:
      - task-man
      - landing

networks:
  internal:
    driver: bridge

volumes:
  task-man-data:
  landing-data:

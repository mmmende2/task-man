services:
  task-man:
    # Pull-based deploy: CI (publish.yml) builds and pushes the image to GHCR
    # on every merge to main; the droplet only pulls (no on-box builds — a cold
    # build thrashes the 1GB box). TASK_MAN_TAG selects which image:
    #   latest (default), sha-<short> for rollback, or a vX.Y.Z-N-g<sha> stamp.
    # To build on-box instead (emergency/local), add the override file:
    #   -f deploy/docker-compose.yml -f deploy/docker-compose.build.yml
    image: ghcr.io/mmmende2/task-man:${TASK_MAN_TAG:-latest}
    restart: unless-stopped
    environment:
      # Origin-side verification of the Access JWT that Cloudflare attaches
      # to every request — defense in depth beyond the tunnel itself.
      - CF_ACCESS_TEAM_DOMAIN=${CF_ACCESS_TEAM_DOMAIN}
      - CF_ACCESS_AUD=${CF_ACCESS_AUD}
      # Authorization: legacy-task owner + service-token→person mapping.
      - TASK_MAN_DEFAULT_OWNER=${TASK_MAN_DEFAULT_OWNER}
      - TASK_MAN_AGENTS=${TASK_MAN_AGENTS}
      # The server computes "today" (metrics, reports) in ITS local time.
      # Without this the container is UTC and evening completions fall on
      # tomorrow's date, so server-rendered metrics drop them. Set to the
      # primary user's IANA timezone.
      - TZ=${TZ:-UTC}
    volumes:
      - task-man-data:/root/.task-man
    networks:
      - internal
    # Deliberately no `ports:` — cloudflared is the only thing that reaches
    # this container, over the internal docker network. No inbound ports on
    # the droplet itself.

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - internal
    depends_on:
      - task-man

networks:
  internal:
    driver: bridge

volumes:
  task-man-data:
